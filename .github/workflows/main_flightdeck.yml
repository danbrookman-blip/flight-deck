# Deploy static Flight Deck site to Azure Web App - Flightdeck
name: Deploy Flight Deck to Azure Web App - Flightdeck

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      id-token: write   # required for OIDC login to Azure
      contents: read    # required for actions/checkout
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE22D8BA018F4EFFA6A4C50FA2846233 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9AAEFACE22B14ABE9FFBAF1842B7BF3A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_74AB11784AF840E0A95B2AC74E7C6AD0 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Flightdeck'
          slot-name: 'Production'
          package: .
